<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz</title>
  </head>
  <body>
    <h1 id="quizName">Quiz</h1>
    <p id="status">Connecting…</p>
    <p id="question"></p>
    <form id="answerForm" hidden>
      <label>
        Answer
        <input id="answer" type="text" required autocomplete="off" />
      </label>
      <button type="submit">Submit answer</button>
    </form>
    <p id="result" role="status"></p>

    <script>
      const nameEl = document.getElementById('quizName');
      const statusEl = document.getElementById('status');
      const questionEl = document.getElementById('question');
      const answerForm = document.getElementById('answerForm');
      const answerInput = document.getElementById('answer');
      const resultEl = document.getElementById('result');
      let submittedAnswer = null;

      function showQuiz() {
        nameEl.hidden = false;
        statusEl.hidden = false;
        questionEl.hidden = false;
        answerForm.hidden = !questionEl.textContent;
      }

      function showResultOnly(message) {
        nameEl.hidden = true;
        statusEl.hidden = true;
        questionEl.hidden = true;
        answerForm.hidden = true;
        resultEl.textContent = message;
      }

      async function loadCurrentQuestion() {
        const response = await fetch('/game/current-question');
        if (!response.ok) throw new Error('Failed to load question');
        const currentQuestion = await response.json();
        render(currentQuestion);
      }

      function render(currentQuestion) {
        questionEl.textContent = currentQuestion.question;
        answerForm.hidden = !currentQuestion.question;
        resultEl.textContent = '';
        answerInput.value = '';
        answerInput.disabled = false;
        submittedAnswer = null;
        showQuiz();
      }

      function connect() {
        const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socket = new WebSocket(`${scheme}//${location.host}`);

        socket.onopen = () => {
          statusEl.textContent = 'Connected';
        };

        socket.onmessage = async (event) => {
          const message = JSON.parse(event.data);
          if (message.type === 'next-question') {
            try {
              await loadCurrentQuestion();
            } catch (error) {
              statusEl.textContent = error.message;
            }
          }
          if (message.type === 'show-answer' && submittedAnswer !== null) {
            const isCorrect = submittedAnswer.trim().toLowerCase() === message.answer.trim().toLowerCase();
            showResultOnly(isCorrect ? 'Correct' : 'Incorrect');
          }
          if (message.type === 'show-leaderboard') {
            window.location.href = '/leaderboard';
          }
        };

        socket.onclose = () => {
          statusEl.textContent = 'Disconnected — reconnecting…';
          setTimeout(connect, 2000);
        };
      }

      answerForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const teamID = localStorage.getItem('teamID');
        if (!teamID) {
          resultEl.textContent = 'Join a team before submitting an answer';
          return;
        }

        const response = await fetch('/game/submit-answer', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            teamID
          },
          body: JSON.stringify({ answer: answerInput.value })
        });
        if (!response.ok) {
          resultEl.textContent = 'Failed to submit answer';
          return;
        }

        submittedAnswer = answerInput.value;
        showResultOnly('Answer submitted');
        answerInput.disabled = true;
      });

      loadCurrentQuestion()
        .catch((error) => {
          statusEl.textContent = error.message;
        });
      connect();
    </script>
  </body>
</html>
