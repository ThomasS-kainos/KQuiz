<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz Lobby</title>
  </head>
  <body>
    <h1>Quiz Lobby</h1>
    <p id="status">Connecting…</p>

    <form id="joinForm">
      <label>
        Team name
        <input id="teamName" maxlength="24" required autocomplete="off" />
      </label>
      <button type="submit">Join</button>
    </form>

    <section id="lobby" hidden>
      <p>You are <strong id="myTeam"></strong></p>
      <h2>Teams</h2>
      <ul id="teams"></ul>
      <button id="leaveBtn" type="button">Leave</button>
    </section>

    <script>
      const statusEl = document.getElementById('status');
      const joinForm = document.getElementById('joinForm');
      const teamNameInput = document.getElementById('teamName');
      const lobbyEl = document.getElementById('lobby');
      const myTeamEl = document.getElementById('myTeam');
      const teamsEl = document.getElementById('teams');
      const leaveBtn = document.getElementById('leaveBtn');

      let myTeamId = null;

      function connect() {
        const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${scheme}//${location.host}`);

        ws.onopen = () => {
          statusEl.textContent = 'Connected';
        };

        ws.onmessage = (event) => handle(JSON.parse(event.data));

        ws.onclose = () => {
          statusEl.textContent = 'Disconnected — reconnecting…';
          setTimeout(connect, 2000);
        };
      }

      function handle(msg) {
        if (msg.type === 'teams-update') {
          renderTeams(msg.teams);
        }
      }

      function renderTeams(teams) {
        teamsEl.replaceChildren();
        teams.forEach((team) => {
          const li = document.createElement('li');
          li.textContent = team.name;
          teamsEl.appendChild(li);
        });
      }

      joinForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const res = await fetch('/lobby/join', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ teamName: teamNameInput.value })
        });
        if (!res.ok) {
          statusEl.textContent = 'Failed to join';
          return;
        }
        const data = await res.json();
        myTeamId = data.uuid;
        myTeamEl.textContent = teamNameInput.value;
        joinForm.hidden = true;
        lobbyEl.hidden = false;
      });

      leaveBtn.addEventListener('click', async () => {
        if (!myTeamId) return;
        await fetch('/lobby/leave', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ teamId: myTeamId })
        });
        myTeamId = null;
        lobbyEl.hidden = true;
        joinForm.hidden = false;
      });

      connect();
    </script>
  </body>
</html>
