<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leaderboard</title>
  </head>
  <body>
    <h1>Leaderboard</h1>
    <p id="status">Connecting...</p>
    <ol id="leaderboard"></ol>

    <script>
      const statusEl = document.getElementById('status');
      const leaderboardEl = document.getElementById('leaderboard');

      function renderLeaderboard(leaderboard) {
        leaderboardEl.replaceChildren();

        if (!leaderboard.length) {
          statusEl.textContent = 'No teams yet';
          return;
        }

        statusEl.textContent = 'Current standings';
        leaderboard.forEach((team) => {
          const item = document.createElement('li');
          item.textContent = `${team.name}: ${team.correctAnswers} correct, ${team.incorrectAnswers} incorrect`;
          leaderboardEl.appendChild(item);
        });
      }

      async function loadLeaderboard() {
        const response = await fetch('/game/leaderboard');
        if (!response.ok) throw new Error('Failed to load leaderboard');

        const data = await response.json();
        renderLeaderboard(data.leaderboard);
      }

      function connect() {
        const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socket = new WebSocket(`${scheme}//${location.host}`);

        socket.onopen = () => {
          statusEl.textContent = 'Waiting for leaderboard...';
        };

        socket.onmessage = (event) => {
          const message = JSON.parse(event.data);
          if (message.type === 'show-leaderboard') {
            renderLeaderboard(message.leaderboard);
          }
        };

        socket.onclose = () => {
          statusEl.textContent = 'Disconnected - reconnecting...';
          setTimeout(connect, 2000);
        };
      }

      loadLeaderboard()
        .catch((error) => {
          statusEl.textContent = error.message;
        });
      connect();
    </script>
  </body>
</html>
